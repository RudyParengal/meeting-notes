name: release

# Builds Notewell-Setup-<version>.exe on Windows, checks the built app starts and
# answers, then attaches the installer to a GitHub Release.
#   Tag a version to publish:   git tag v1.0.0 && git push origin v1.0.0
#   Or run it by hand from the Actions tab: builds and keeps the file, no Release.
#
# The build job can only read the repository. Only the short publish job, which
# runs no code from the repository's dependencies, may write a Release.
# Every action is pinned to a commit, so a moved tag cannot change what runs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write          # signs the build provenance (who built it, from which commit)
      attestations: write
    outputs:
      version: ${{ steps.installer.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install what the app is built from
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r windows-recorder/requirements.txt -r windows-recorder/requirements-diarize.txt -r desktop/requirements.txt pyinstaller==6.22.3
          python windows-recorder/fetch_models.py

      - name: Build the app
        run: pyinstaller desktop/notewell.spec --noconfirm

      - name: Check the built app starts and answers
        shell: pwsh
        run: |
          $env:NOTEWELL_HOME = "$env:RUNNER_TEMP\nw-home"
          $app = Start-Process dist\Notewell\Notewell.exe -PassThru
          $ok = $false
          foreach ($i in 1..90) {
            Start-Sleep 1
            if (Test-Path "$env:NOTEWELL_HOME\port") {
              $port = (Get-Content "$env:NOTEWELL_HOME\port").Trim()
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:$port/health"
                $page = Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing
                if ($health.status -eq "ok" -and $page.Content -match "<title>Notewell</title>") { $ok = $true; break }
              } catch {}
            }
          }
          Get-Process Notewell -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:NOTEWELL_HOME\recorder\recorder.log" -Tail 40 -ErrorAction SilentlyContinue; throw "the built app did not answer within 90 s" }
          Write-Host "built app answered on port $port after $i s"

      - name: Build the installer
        id: installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev" }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress -y }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$pwd\dist\Notewell" desktop\installer.iss
          if ($LASTEXITCODE) { throw "the installer did not build" }
          $exe = "dist\Notewell-Setup-$version.exe"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$sha  Notewell-Setup-$version.exe" | Set-Content "$exe.sha256" -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "SHA-256 $sha"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Notewell-Setup-*.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Notewell-Setup-${{ steps.installer.outputs.version }}
          path: |
            dist/Notewell-Setup-*.exe
            dist/Notewell-Setup-*.exe.sha256

  publish:
    if: github.ref_type == 'tag'
    needs: windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.windows-installer.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Notewell-Setup-${{ env.VERSION }}
          path: out
      - name: Attach to a Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release notes are this version's section of CHANGELOG.md, then the checksum.
          $sections = (Get-Content CHANGELOG.md -Raw -Encoding utf8) -split "(?m)^## "
          $notes = ($sections | Where-Object { $_ -like "$env:VERSION *" } | Select-Object -First 1)
          if (-not $notes) { throw "CHANGELOG.md has no '## $env:VERSION' section" }
          $sha = (Get-Content "out/Notewell-Setup-$env:VERSION.exe.sha256").Split(" ")[0]
          $check = "### Check your download`n`nSHA-256: ``$sha```n`nIn PowerShell: ``Get-FileHash .\Notewell-Setup-$env:VERSION.exe```n`n" +
                   "Who built it, and from which commit: ``gh attestation verify Notewell-Setup-$env:VERSION.exe --repo $env:GH_REPO``"
          "## $notes`n$check" | Set-Content release-notes.md -Encoding utf8
          gh release create "$env:TAG" "out/Notewell-Setup-$env:VERSION.exe" "out/Notewell-Setup-$env:VERSION.exe.sha256" --title "Notewell $env:VERSION" --notes-file release-notes.md
