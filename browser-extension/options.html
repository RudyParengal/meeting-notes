<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Notewell recorder helper options</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      margin: 16px;
      max-width: 420px;
      color: #1f2328;
      line-height: 1.45;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 10px 0;
    }
    p {
      font-size: 13px;
      color: #57606a;
      margin: 0 0 14px 0;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
      font-size: 14px;
      cursor: pointer;
    }
    #status {
      font-size: 12px;
      color: #1a7f37;
      min-height: 18px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Notewell recorder helper</h1>
  <p>Only sends activity to Notewell on this computer while a screen recording runs. Never reads cookies, passwords, form fields, headers, or page text.</p>
  <label>
    <input type="checkbox" id="sendConsole" checked>
    <span>Send console messages</span>
  </label>
  <label>
    <input type="checkbox" id="sendNetwork" checked>
    <span>Send network requests</span>
  </label>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="options.js"></script>
</body>
</html>
